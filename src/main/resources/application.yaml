server:
  port: 8081

spring:
  application:
    name: tramitador

  datasource:
    url: jdbc:postgresql://localhost:5432/tramitador
    username: postgres
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4.1-mini

tramitador:
  umbral: 0.8
